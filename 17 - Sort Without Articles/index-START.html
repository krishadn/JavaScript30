<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sort Without Articles</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: url("https://images.unsplash.com/photo-1758179156914-bcc9a0d2a4b0");
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    #bands {
      list-style: inside square;
      font-size: 20px;
      background: white;
      width: 500px;
      margin: auto;
      padding: 0;
      box-shadow: 0 0 0 20px rgba(0, 0, 0, 0.05);
    }

    #bands li {
      border-bottom: 1px solid #efefef;
      padding: 20px;
    }

    #bands li:last-child {
      border-bottom: 0;
    }

    a {
      color: #ffc600;
      text-decoration: none;
    }
    p {
      color: #FFF;
    }

  </style>

  <ul id="bands"></ul>
  <p>Photo by <a href="https://unsplash.com/@ahmetyuksek?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Ahmet Yüksek ✪</a> on <a href="https://unsplash.com/photos/silhouetted-mountain-peaks-against-a-warm-sunset-sky-mybaeBtxOj8?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Unsplash</a></p>

<script>
const bands = ['The Plot in You', 'The Devil Wears Prada', 'Pierce the Veil', 'Norma Jean', 'The Bled', 'Say Anything', 'The Midway State', 'We Came as Romans', 'Counterparts', 'Oh, Sleeper', 'A Skylit Drive', 'Anywhere But Here', 'An Old Dog'];

const articles = /^The |An |A /;

bands.sort((a, b) => {
  if (a.replace(articles, "") > b.replace(articles, "")) {
    return 1;
  } else if (a.replace(articles, "") < b.replace(articles, "")) {
    return -1;
  } else {
    return 0
  }
});

const bandList = document.querySelector("#bands");

bands.forEach(band => {

  const item = document.createElement("li");
  item.textContent = band;

  bandList.appendChild(item);


})


</script>

</body>
</html>
